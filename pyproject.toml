[project]
name = "gardrop-ai"
version = "0.1.0"
description = "AI service for Gardrop: clothing tagging, closet matching and an AI stylist."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "pillow>=11.0",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "open-clip-torch>=2.29",
    "torch>=2.5",
    "torchvision>=0.20",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

# On Linux (CI, Docker) install the small CPU-only PyTorch instead of the CUDA build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
